# Default settings. Override any key here; unknown keys are rejected.
workspace_dir: data/shorts/workspace

download:
  max_height: 1440          # 2160 (4K) = sharpest crops but ≈2-3 GB per video; needs free disk
  prefer_codec: vp9         # vp9 decodes much faster than av1 on CPU
  cookies_from_browser: null  # e.g. "firefox" if YouTube asks to confirm you're not a bot
  cookies_file: data/shorts/cookies.txt  # exported YouTube cookies; used if present (needed on servers)
  min_free_disk_gb: 3.0
  live_last_min: 0          # live streams: only the last N minutes up to now (0 = whole stream from the start)

transcribe:
  model: large-v3-turbo     # most accurate that's still faster than realtime on 2 vCPU (1.8x; small.en = 2.8x, more mistakes)
  compute_type: int8
  threads: 0                # 0 = all CPU cores
  beam_size: 5
  vad: true
  min_word_prob: 0.0        # words below this are dropped (0 = keep all)
  title_hints: true         # title + channel as Whisper hints: names spelled right, and turbo keeps its punctuation

sentences:
  max_words: 20             # split long run-on sentences (shorter units = clip edges closer to the hook / payoff)
  max_gap_s: 1.0            # a pause longer than this starts a new sentence

select:                     # "Find moments" (Gemini free tier)
  model: gemini-3.8-flash
  fallback_models: [gemini-3.6-flash, gemini-3.5-flash-lite]  # used on 503 / daily quota
  window_min: 20            # transcript sent in ~20 min windows (one call each)
  overlap_min: 2
  min_clip_s: 15
  max_clip_s: 50             # the most-viewed Shorts are almost all 25-47 s
  min_score: 4              # 0-10; kept low on purpose, you review the picks
  min_hook_score: 5         # after the editor pass: drop clips whose first line won't stop the scroll
  min_standalone_score: 5   # ...or that only make sense if you watched the video
  trim_promo: true          # cut trailing plugs: "go check it out", sponsors, "link in the description"
  trim_lead_fillers: true   # open on the first real word: "And now we're back..." -> "we're back..."
  max_clips: 25
  offline_fallback: true    # if Gemini is down, pick moments with a heuristic
  refine: true              # 2nd "editor" pass: compares all picks, tightens hooks, writes hook text/title/hashtags
  use_heatmap: true         # use YouTube "Most replayed" data when the video has it
  use_audio: true           # loudness + reactions (crash, screams, laughter) read from the audio

preview:                    # quick review renders: low quality on purpose so they're fast
  width: 540
  height: 960
  crf: 28
  preset: ultrafast
  max_fps: 30               # 60 fps sources previewed at 30

export:                     # "Export HD" / `shorts export`: what you upload
  dir: data/shorts/exports              # -> data/shorts/exports/<video title>/NN-title.mp4 + NN-title.txt (title, description, hashtags)
  width: 1080
  height: 1920
  crf: 18                   # lower = better quality, bigger file
  preset: faster            # x264 speed ("medium"/"slow" = smaller files, much slower)
  max_fps: 0                # 0 = keep source fps; 30 = exports twice as fast (60 fps gameplay looks smoother though)
  sharpen: 0.45             # light sharpening after upscaling (0 = off)

audio:
  loudness_lufs: -14        # Shorts/TikTok/Reels level, so every clip plays equally loud
  highpass_hz: 70           # removes rumble

hook:                       # on-screen hook text (written by Gemini) over the first seconds
  enabled: true
  auto: true                # only when the spoken first line doesn't already state the premise
  duration_s: 2.8
  position: 0.17            # vertical centre, fraction of the height

cold_open:                  # open on a flash of the payoff, then a hard cut to the start
  enabled: false            # off: out of context the flash sounds like a stray bit of another moment
  duration_s: 0.7           # a wordless reaction flash (crash, scream, laugh)...
  min_phrase_s: 0.4         # ...or a whole spoken phrase with a pause on both sides (never cut mid-word)
  max_phrase_s: 1.2
  min_lead_s: 6             # skipped when the payoff comes sooner than this
  when: always              # "no_premise" = only when the spoken first line doesn't already state the premise

pacing:                     # jump cuts over dead air between words
  enabled: true
  min_gap_s: 0.55           # pauses longer than this...
  keep_gap_s: 0.2           # ...are cut down to this
  max_gap_s: 3.0            # longer pauses kept (usually something is happening on screen)

captions:                   # word-by-word, burned into the previews
  enabled: true
  font: Inter Black
  size: 92                  # on a 1080x1920 canvas
  uppercase: true
  max_words: 2              # 1-2 words at a time, like the biggest Shorts
  max_chars: 16
  position: 0.6             # bottom of the text at 60% of the height (mid-frame, clear of Shorts UI)
  highlight_color: "#FFE600"
  emphasis_color: "#4ADE80" # words the AI flagged
  emphasize_numbers: true   # money and numbers always green ("$10,000")
  avoid_text: true          # a line that would cover the source's own on-screen text moves above/below it
  offset_ms: 0              # shift captions if they feel early/late (negative = earlier)

reframe:                    # 16:9 -> 9:16, shot by shot
  enabled: true             # false = plain centre crop
  detect_text: true         # find burned-in text (source captions, graphics) once per second, for the captions stage
  sample_fps: 6             # face checks per second (plus the first frame of every shot)
  min_face_h: 0.05          # ignore faces smaller than 5% of the frame height (crowds)
  cut_threshold: 0.25       # camera-cut sensitivity (lower = more cuts)
  static_tolerance: 0.05    # subject moves less than this -> locked crop, no motion
  max_speed: 0.5            # max crop pan, frame widths per second
  fit_y: 0.42               # FIT shots: where the full frame sits (keeps captions clear)
  screen_layout: pip        # facecam over gameplay: "pip" = gameplay fills the frame, cam in a top corner;
                            # "split" = cam panel on top, gameplay below; "track" = ignore the cam box
  pip_corner: auto          # PIP: "auto" (same side as in the source), "left" or "right"
  pip_width: 0.42           # cam width, fraction of the frame width (max pip_max_h of the height)
  pip_max_h: 0.28
  pip_top: 0.075            # top edge, fraction of the height (clear of the Shorts top bar)
  pip_border: 6             # white border, px at 1080 wide (0 = none)
