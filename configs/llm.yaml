# Which AI answers each part of Studio. Edit this file to try another provider; no code changes, no restart
# (it is re-read on the next call). Provider code: src/common/llm_providers.py.
#
# How a call is routed:
#   1. tasks.<name>  if that task is listed below
#   2. media         if the call sends audio or video (only Gemini can take those)
#   3. default       everything else
# A route's `models:` are tried in order (the next one on quota / overload). If a route has no models:
#   Gemini uses the models in configs/shorts.yaml (select.model + fallback_models),
#   any other provider uses the `models:` listed under its entry in `providers:`.
#
# A model chosen in the UI is saved to configs/llm.local.yaml and wins over tasks: below.
#
# When every model of a task's provider fails (quota, overload, retired model, refused key), the other providers
# are tried, in the order listed under providers:. `fallback: auto` = every other provider whose key is set;
# a list (e.g. [gemini]) = only those; `none` = never switch provider.
#
# Several keys for one provider: GEMINI_API_KEY, GEMINI_API_KEY_2, GEMINI_API_KEY_3... in .env. The next key is
# used when one runs out of quota or is refused (quota is counted per key and model).
#
# Task names: shorts.select, shorts.refine

fallback: auto

default:
  provider: gemini
  models: []

media:
  provider: gemini
  models: []

tasks:
  shorts.select: {provider: nvidia}   # uses providers.nvidia.models (nemotron)
  shorts.refine: {provider: nvidia}
  # Example: send only the shorts clip picker to NVIDIA's free endpoint:
  # shorts.select: {provider: nvidia, models: [meta/llama-3.3-70b-instruct]}

providers:
  gemini:
    kind: gemini
    api_key_env: GEMINI_API_KEY

  # NVIDIA NIM: free key at https://build.nvidia.com (rate limited). Model ids are listed on that site.
  nvidia:
    kind: openai
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    # every model listed here shows up in Studio's model picker (Clips panel); the first is the default
    # (deepseek-ai/deepseek-v4.1-flash was retired by NVIDIA: HTTP 410)
    models: [nvidia/nemotron-3.5-super-vl-120b-a12b, mistralai/mistral-large-4-1t-a52b]
    min_interval_s: 2

  # OpenRouter: one key, many models (some free, ids ending in :free).
  openrouter:
    kind: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models: [meta-llama/llama-3.3-70b-instruct:free]
    min_interval_s: 4

  groq:
    kind: openai
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models: [llama-3.3-70b-versatile]
    min_interval_s: 2

  # A model running on this machine (ollama serve). No key needed.
  ollama:
    kind: openai
    base_url: http://127.0.0.1:11434/v1
    api_key_env:
    models: [llama3.1]
    json_mode: object
    min_interval_s: 0
