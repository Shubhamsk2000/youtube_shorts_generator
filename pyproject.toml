[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-video-gen"
version = "0.1.0"
description = "Vertical short-video tools: long YouTube video -> shorts, anime episode -> edits"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1",
    "psutil>=5.9",
    "yt-dlp[default]",
    "faster-whisper>=1.1",
    "av<19",  # PyAV 19 dropped av.open(metadata_errors=...), which faster-whisper 1.2.1 still passes
    "opencv-python-headless>=4.9",  # YuNet face detection + frame compositing
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",     # anime: tweet-card template
    "pysubs2>=1.7",   # anime: read SRT/ASS subtitle tracks
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shorts = "shorts.cli:app"
anime = "anime.cli:app"
studio = "studio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
